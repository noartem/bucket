name: Excavator

on:
  workflow_dispatch:
  schedule:
    # run every 4 hours
    - cron: '20 */4 * * *'
  # Primary path: a release workflow in an app repo (twentymate / vantage-box)
  # sends this dispatch right after publishing a release. The schedule above is
  # only a fallback in case a dispatch doesn't arrive.
  repository_dispatch:
    types: [new-release]

# Don't let a scheduled run and a dispatch run (or two dispatches) race each
# other and double-commit; let the in-flight one finish.
concurrency:
  group: excavator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
